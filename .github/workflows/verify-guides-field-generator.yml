  push:
    branches: ["master"]
    paths:
      - ".github/workflows/verify-guides-field-generator.yml" # Test changes to this file
      - "field-generator/"
      
jobs:
  test:
    uses: vespa-engine/gh-actions/.github/workflows/verify-markdown-guides.yml@b9b3093fe531392b08e7a71ffa8bcd88cb529bc3 # main
    with:
      test-file: "field-generator/README.md"
