name: Verify ColPali dependencies and startup

on:
  pull_request:
    paths:
      - "visual-retrieval-colpali/**"
      - ".github/workflows/verify-colpali.yml"
  push:
    branches: [master]
    paths:
      - "visual-retrieval-colpali/**"
      - ".github/workflows/verify-colpali.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: visual-retrieval-colpali
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        run: python -m pip install uv==0.12.19
      - name: Install the requirements like Hugging Face Spaces does
        run: |
          sdk_version=$(sed -n 's/^sdk_version: //p' src/README.md)
          uv venv --python 3.11 /tmp/colpali-hf-test
          uv pip install --no-cache --python /tmp/colpali-hf-test/bin/python -r src/requirements.txt \
            "gradio[oauth,mcp]==$sdk_version" "uvicorn>=0.14.0" "websockets>=10.4" spaces
          uv pip check --python /tmp/colpali-hf-test/bin/python
      - name: Check that the app starts
        run: /tmp/colpali-hf-test/bin/python tests/huggingface_smoke.py --source src
      - name: Check that the ColPali model loads with its adapter
        run: /tmp/colpali-hf-test/bin/python tests/huggingface_smoke.py --source src --load-model
